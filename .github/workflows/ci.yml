name: ci

on:
  push:
  pull_request:

jobs:
  agent:
    # Our own runner. GitHub's hosted runners are metered on a private repo and
    # queue one job at a time; this repo is public, but one runner pool keeps
    # both repos on the same, predictable path. The timeout makes a wedged job
    # fail loudly instead of hanging.
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -count=1 ./...
      - run: CGO_ENABLED=0 go build ./...
